# Version Tree (VT) Application Properties
# Web Server Port (Configured on 8082 to avoid conflict with PostgreSQL on port 8080)
server.port=8082

# JSP View Resolver Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Static Resource Handling
spring.mvc.static-path-pattern=/static/**

# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/MiniGithub
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

# Upload File Size Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
