# Version Tree (VT) Application Properties
# Web Server Port (Configured on 8082 to avoid conflict with PostgreSQL on port 8080)
server.port=8082

# JSP View Resolver Configuration
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Static Resource Handling
spring.mvc.static-path-pattern=/static/**

# Database Configuration (H2 Embedded Mode enabled by default for instant compilation & testing)
# To use PostgreSQL, uncomment the postgresql properties below and comment the H2 properties.

# --- H2 EMBEDDED CONFIGURATION ---
spring.datasource.url=jdbc:h2:mem:versiontree;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- POSTGRESQL CONFIGURATION ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/versiontree
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# For PostgreSQL use: org.hibernate.dialect.PostgreSQLDialect

# Upload File Size Limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
